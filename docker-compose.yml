# Стек для Portainer: CV-сайт только на 127.0.0.1:8350 (не публикуем на 0.0.0.0 — иначе обход UFW).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: valenchitscv:latest
    container_name: valenchitscv
    ports:
      - "127.0.0.1:8350:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
