# www → apex одним хопом. Контейнер слушает только :80.
# Двухшаговый http://www → https://www → apex делает TLS-прокси перед контейнером:
# там же нужно сразу редиректить http://www и https://www на https://valenchits.dev$request_uri.
server {
    listen 80;
    server_name www.valenchits.dev;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://valenchits.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name valenchits.dev _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml application/manifest+json;

    # ngx_brotli собирается в Dockerfile и подключается в main-контексте.
    # На nginx без модуля эти три директивы нужно закомментировать.
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # add_header из server не наследуется location-ами со своим add_header — там тот же набор.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://yastatic.net https://mc.webvisor.com https://mc.webvisor.org https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.webvisor.com wss://mc.webvisor.org https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src blob: https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
    location = /index.html { return 301 https://valenchits.dev/; }
    location = /ru/index.html { return 301 https://valenchits.dev/ru/; }
    location = /be/index.html { return 301 https://valenchits.dev/be/; }
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location = /ru/ {
        expires -1;
        try_files /ru/index.html =404;
    }
    location = /be/ {
        expires -1;
        try_files /be/index.html =404;
    }
    # charset по умолчанию выключен, mime .txt — text/plain без charset.
    # Пустой types сбрасывает карту расширений, чтобы Content-Type был ровно text/plain; charset=utf-8.
    location = /llms.txt {
        types { }
        default_type text/plain;
        charset utf-8;
    }
    location = /llms-full.txt {
        types { }
        default_type text/plain;
        charset utf-8;
    }
    location = /ru { return 301 https://valenchits.dev/ru/; }
    location = /be { return 301 https://valenchits.dev/be/; }
    location / { try_files $uri =404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://yastatic.net https://mc.webvisor.com https://mc.webvisor.org https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.webvisor.com wss://mc.webvisor.org https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src blob: https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org" always;
        try_files $uri =404;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://yastatic.net https://mc.webvisor.com https://mc.webvisor.org https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.by https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.webvisor.com wss://mc.webvisor.org https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src blob: https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org" always;
        try_files $uri =404;
    }
}
