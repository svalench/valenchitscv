# Keep the original Host header at the TLS reverse proxy.
server {
    listen 80;
    server_name www.valenchits.dev;
    return 301 https://valenchits.dev$request_uri;
}
server {
    listen 80 default_server;
    server_name valenchits.dev _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /index.html { return 301 https://valenchits.dev/; }
    location = /ru/index.html { return 301 https://valenchits.dev/ru/; }
    location = /be/index.html { return 301 https://valenchits.dev/be/; }
    location = / { try_files /index.html =404; }
    location = /ru/ { try_files /ru/index.html =404; }
    location = /be/ { try_files /be/index.html =404; }
    location = /ru { return 301 https://valenchits.dev/ru/; }
    location = /be { return 301 https://valenchits.dev/be/; }
    location / { try_files $uri =404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /img/ {
        expires 7d;
        try_files $uri =404;
    }
}
